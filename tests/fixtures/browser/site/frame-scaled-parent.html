<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Scaled frame</title>
<style>
  body { margin: 0; font: 16px sans-serif }
  /* 300x200 at (100, 100), drawn twice its size from its top-left: it covers (100, 100) to (700, 500). */
  #scaled { position: absolute; left: 100px; top: 100px; width: 300px; height: 200px; border: 0; transform: scale(2); transform-origin: 0 0 }
</style></head>
<body>
  <iframe id="scaled" title="Scaled choices" src="__CHILD_ORIGIN__/frame-scaled-child.html"></iframe>
</body>
</html>
