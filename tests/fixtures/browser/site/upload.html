<!doctype html><meta charset="utf-8"><title>Upload fixture</title>
<input aria-label="Files" id="files" type="file" accept=".txt,text/plain" multiple><p id="result">none</p>
<script>document.querySelector('#files').addEventListener('change',e=>{document.querySelector('#result').textContent=[...e.target.files].map(f=>f.name).join(',')})</script>
