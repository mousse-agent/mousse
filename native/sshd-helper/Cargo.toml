[package]
name = "mousse-sshd-helper"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Windows only: the per-session helper of the Mousse SSH endpoint."

# The process must be named `sshd.exe`: VS Code's Windows server script looks for an ancestor of that name.
[[bin]]
name = "sshd"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
