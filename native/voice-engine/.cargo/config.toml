# The prebuilt ONNX Runtime the `ort` crate downloads is kept in the crate's own target folder, not in the user's
# cache folder: a build stays in the checkout, and CI caches it with the rest of the build.
[env]
ORT_CACHE_DIR = { value = "target/ort", relative = true }
# The prebuilt ONNX Runtime for macOS is built for macOS 13.4 and calls the compiler's `__isPlatformVersionAtLeast`,
# which only links when the engine targets 13.4 or later too. Older Macs fall back to WebAssembly read aloud.
MACOSX_DEPLOYMENT_TARGET = "13.4"
