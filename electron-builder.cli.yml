appId: com.ryspa.mousse.cli
productName: mousse-cli
executableName: mousse-cli
artifactName: mousse-cli-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.mjs
directories:
  output: release/cli
  buildResources: resources
extraMetadata:
  main: out/main/cli.js
compression: normal
files:
  - out/main/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/@fluentui/**'
  - '!**/node_modules/lucide-react/**'
  - '!**/node_modules/monaco-editor/**'
  - '!**/node_modules/@monaco-editor/**'
  - '!**/node_modules/react/**'
  - '!**/node_modules/react-dom/**'
  - '!**/node_modules/react-markdown/**'
  - '!**/node_modules/rehype-highlight/**'
  - '!**/node_modules/remark-gfm/**'
  - '!**/node_modules/zustand/**'
  - '!**/node_modules/@xterm/**'
  - '!**/node_modules/node-pty/src/**'
  - '!**/node_modules/node-pty/deps/**'
  - '!**/node_modules/node-pty/scripts/**'
  - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!**/node_modules/node-pty/**/*.{map,ts,md}'
  - '!**/node_modules/node-pty/**/*.test.js'
asarUnpack:
  - node_modules/node-pty/build/Release/**
  - node_modules/node-pty/prebuilds/darwin-*/**
  - node_modules/node-pty/prebuilds/win32-x64/**
  - node_modules/node-pty/prebuilds/linux-x64/**
  - node_modules/node-pty/third_party/**
npmRebuild: false
extraResources:
  - from: macros
    to: macros
win:
  target:
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  signExecutable: false
linux:
  target:
    - AppImage
  category: Development
mac:
  target:
    - zip
  category: public.app-category.developer-tools
