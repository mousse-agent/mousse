name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tools:
    name: Workflow tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: node --test scripts/team-status.test.mjs

  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build application, CLI, and browser worker
        run: npm run build
      - name: Install browser test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth dbus-x11 unzip libnss3 libgbm1 libgtk-3-0t64 libasound2t64
          node scripts/check-browser-worker-install.mjs
      - name: Configure Linux browser sandboxes
        run: |
          # Use Chromium's supported SUID helper, including for fixture copies of
          # Chrome. Do not disable the runtime sandbox or host userns restrictions.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo install -d -o root -g root -m 755 /opt/mousse-ci
          sudo install -o root -g root -m 4755 .mousse-dev/browser-binaries/binaries/certified/chrome-linux64/chrome_sandbox /opt/mousse-ci/chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/opt/mousse-ci/chrome-sandbox' >> "$GITHUB_ENV"
      - name: Run application checks with a real display
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' dbus-run-session -- npm test -- --maxWorkers=2

  windows:
    name: Windows focused checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Test fixtures create their own repositories and compare checked-out bytes;
      # the runner's default core.autocrlf=true would rewrite LF to CRLF.
      - run: git config --global core.autocrlf false
      - name: Run Windows-relevant tests
        env:
          # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...), which
          # owned-root containment checks do not yet canonicalize (#27). Use the
          # long-path runner temp until short-path normalization lands.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          npx vitest run
          tests/browserWindowsSandboxPermissions.test.ts
          tests/cliWindowsConsoleTty.test.ts
          tests/platformWindowsPackageQualification.test.ts
          tests/resourcePurgeWindows.test.ts
          tests/selectiveWorktree.test.ts
          tests/threadWorkspace.test.ts
          tests/threadWorktreeToggle.test.ts
          tests/worktreeCompletion.test.ts
          tests/worktreeReadiness.test.ts
          tests/worktreeRetirement.test.ts
