name: Updater trial

# Temporary: checks packaging, then installs one nightly and updates it in place to the
# next through the in-app updater, on a clean Windows runner. Publishes nothing.
on:
  push:
    branches: [in-app-updates]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: 0.1.2-nightly.20261021.${{ github.run_number }}

  update-in-place:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MOUSSE_ID_ORIGIN: https://api.mousse.work
      OLD: 0.1.2-nightly.20261021.900
      NEW: 0.1.2-nightly.20261021.901
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Locate MSBuild for the node-pty rebuild
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the old and the new version
        run: |
          New-Item -ItemType Directory C:\upd\old, C:\upd\feed, C:\upd\home -Force | Out-Null
          npm version $env:OLD --no-git-tag-version --allow-same-version
          npm run dist:win
          Copy-Item "release\Mousse.Setup.$env:OLD.exe" C:\upd\old\
          npm version $env:NEW --no-git-tag-version --allow-same-version
          npm run dist:win
          Copy-Item "release\Mousse.Setup.$env:NEW.exe", "release\Mousse.Setup.$env:NEW.exe.blockmap" C:\upd\feed\
          Copy-Item release\latest.yml C:\upd\feed\nightly.yml
          Get-Content C:\upd\feed\nightly.yml
      - name: Install the old version
        run: |
          Start-Process -Wait "C:\upd\old\Mousse.Setup.$env:OLD.exe" -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\Programs\Mousse"
          "Product version string: $((Get-Item "$dir\Mousse.exe").VersionInfo.ProductVersion)"
          $version = (& "$dir\mousse-cli.exe" --version | Out-String).Trim()
          "Installed: $version"
          if ($version -ne "mousse-cli $env:OLD") { throw "Expected $env:OLD" }
      - name: Update through the app
        env:
          MOUSSE_UPDATE_FEED_URL: http://127.0.0.1:8799/
          MOUSSE_HOME: C:\upd\home
        run: |
          @'
          import { createServer } from 'node:http'
          import { createReadStream, statSync } from 'node:fs'
          import { join } from 'node:path'
          createServer((req, res) => {
            const path = join(process.argv[2], decodeURIComponent(new URL(req.url, 'http://x').pathname.slice(1)))
            try { res.writeHead(200, { 'content-length': statSync(path).size }); createReadStream(path).pipe(res); console.log('200', req.url) }
            catch { res.writeHead(404).end(); console.log('404', req.url) }
          }).listen(8799, '127.0.0.1')
          '@ | Set-Content "$env:RUNNER_TEMP\feed.mjs"
          @'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          async function evaluate(expression, { awaitReply = true } = {}) {
            for (let attempt = 0; attempt < 180; attempt++) {
              try {
                const pages = await (await fetch('http://127.0.0.1:9333/json/list')).json()
                const page = pages.find((target) => target.type === 'page' && target.url.startsWith('file:'))
                if (page) {
                  const ws = new WebSocket(page.webSocketDebuggerUrl)
                  await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject })
                  const reply = new Promise((resolve) => { ws.onmessage = (message) => resolve(JSON.parse(message.data)) })
                  ws.send(JSON.stringify({ id: 1, method: 'Runtime.evaluate', params: { expression, awaitPromise: true, returnByValue: true } }))
                  if (!awaitReply) { await wait(2000); ws.close(); return undefined }
                  const result = await reply
                  ws.close()
                  if (result.result?.exceptionDetails) throw new Error(JSON.stringify(result.result.exceptionDetails))
                  return result.result?.result?.value
                }
              } catch (error) { console.log('waiting for the window:', String(error).slice(0, 120)) }
              await wait(1000)
            }
            throw new Error('The Mousse window never answered')
          }
          const state = () => evaluate('window.mousse.updates.getState()')
          let current = await evaluate('window.mousse.updates.check()')
          console.log('check:', JSON.stringify(current))
          if (current.phase !== 'available' || current.availableVersion !== process.env.NEW) throw new Error('No update offered')
          await evaluate('window.mousse.updates.download()')
          for (let i = 0; i < 300 && (current = await state()).phase === 'downloading'; i++) await wait(1000)
          console.log('download:', JSON.stringify(current))
          if (current.phase !== 'downloaded') throw new Error('Download did not finish')
          await evaluate('window.mousse.updates.install()', { awaitReply: false })
          console.log('install requested')
          '@ | Set-Content "$env:RUNNER_TEMP\drive.mjs"
          Start-Process node -ArgumentList "$env:RUNNER_TEMP\feed.mjs", 'C:\upd\feed' -RedirectStandardOutput C:\upd\feed.log
          Start-Process "$env:LOCALAPPDATA\Programs\Mousse\Mousse.exe" -ArgumentList '--remote-debugging-port=9333'
          node "$env:RUNNER_TEMP\drive.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Driving the update failed' }
      - name: The new version is installed, running and serving
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Mousse\Mousse.exe"
          $deadline = (Get-Date).AddMinutes(5)
          do { Start-Sleep 5; $version = (& "$env:LOCALAPPDATA\Programs\Mousse\mousse-cli.exe" --version 2>$null | Out-String).Trim(); "installed: $version" } until ($version -eq "mousse-cli $env:NEW" -or (Get-Date) -gt $deadline)
          if ($version -ne "mousse-cli $env:NEW") { throw "Still $version" }
          "Product version string: $((Get-Item $exe).VersionInfo.ProductVersion)"
          $record = "C:\upd\home\electron-user-data\updates.json"
          $deadline = (Get-Date).AddMinutes(3)
          do { Start-Sleep 5; $text = Get-Content $record -Raw -ErrorAction SilentlyContinue; "record: $text" } until (($text -and $text -notmatch '"install"') -or (Get-Date) -gt $deadline)
          if (-not $text -or $text -match '"install"') { throw 'The relaunched app did not confirm the update' }
          $deadline = (Get-Date).AddMinutes(3)
          do { Start-Sleep 5; $status = & "$env:LOCALAPPDATA\Programs\Mousse\mousse-cli.exe" --home C:\upd\home --mode json service status | Out-String; "service: $status" } until ($status -match "`"version`":\s*`"$([regex]::Escape($env:NEW))`"" -or (Get-Date) -gt $deadline)
          if ($status -notmatch "`"version`":\s*`"$([regex]::Escape($env:NEW))`"") { throw 'The background service is not the new version' }
          Get-Process Mousse | Select-Object Id, Path | Format-Table
      - name: Logs
        if: always()
        run: |
          Get-Content C:\upd\feed.log -ErrorAction SilentlyContinue
          Get-Content C:\upd\home\mms-startup.log -Tail 60 -ErrorAction SilentlyContinue
